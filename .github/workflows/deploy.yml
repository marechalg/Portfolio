name: guewen-marechal.ovh

on:
    release:
        types: [published]

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Build & push image
              run: |
                REPO=ghcr.io/${{ github.repository_owner }}/portfolio
                VERSION=${{ github.event.release.tag_name }}
                echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
                docker buildx build --platform linux/arm64 \
                    -t $REPO:$VERSION \
                    -t $REPO:latest \
                    --push .
            
            - name: Install cloudflare
              run: |
                curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
                sudo dpkg -i cloudflared.deb

            - name: Setup SSH over Cloudflare
              run: |
                mkdir -p ~/.ssh
                echo "${{ secrets.PI_SSH }}" > ~/.ssh/deploy_key
                chmod 600 ~/.ssh/deploy_key
                cat > ~/.ssh/config <<EOF
                Host pi
                  HostName ${{ secrets.PI_HOST }}
                  User ${{ secrets.PI_USER }}
                  IdentityFile ~/.ssh/deploy_key
                  ProxyCommand cloudflared access ssh --service-token-id ${{ secrets.CF_ACCESS_CLIENT_ID }} --service-token-secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }} --hostname %h
                  StrictHostKeyChecking no
                  UserKnownHostsFile /dev/null
                EOF
                chmod 600 ~/.ssh/config

            - name: Copy compose & deploy
              run: |
                scp docker-compose.yml pi:/opt/portfolio/docker-compose.yml
                ssh pi "cd /opt/portfolio && \
                  printf 'REPO_OWNER=%s\nTUNNEL_TOKEN=%s\n' '${{ github.repository_owner }}' '${{ secrets.TUNNEL_TOKEN }}' > .env && \
                  echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
                  docker compose pull && docker compose up -d"