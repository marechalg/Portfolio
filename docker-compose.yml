services:
  web:
    image: ghcr.io/${REPO_OWNER}/portfolio:latest
    restart: unless-stopped
    expose:
      - "80"
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}